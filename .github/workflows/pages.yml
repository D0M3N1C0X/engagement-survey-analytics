# Publishes the interactive dashboard to GitHub Pages.
# Enable it once under Settings -> Pages -> Source: GitHub Actions.
name: dashboard

on:
  push:
    branches: [main]
    # Only redeploy when the published site actually changes. A commit that
    # touches the analysis code alone does not need a Pages deployment, and
    # tying every commit to GitHub's deployment backend means an unrelated
    # change gets marked red whenever that backend is slow.
    paths:
      - dashboard.html
      - reports/**
      - site-assets/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the dashboard from the committed data
        run: |
          python3 src/build_dashboard.py
          mkdir -p site
          cp dashboard.html site/index.html
          cp -r reports site/reports

      - name: Add the link preview
        run: |
          cp site-assets/og.png site/og.png
          python3 - <<'PY'
          from pathlib import Path
          page = Path("site/index.html")
          html = page.read_text(encoding="utf-8")
          assert html.count("<head>") == 1, "expected one <head> tag"
          meta = Path("site-assets/og-meta.html").read_text(encoding="utf-8")
          page.write_text(html.replace("<head>", "<head>\n" + meta, 1), encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
