name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the full pipeline (nothing to install)
        run: python3 src/run_all.py

      - name: Tests (standard library only)
        run: python3 -m unittest discover -s tests -v

      - name: The browser tool's engine gives Python's answers
        run: node tests/js/check_engine.mjs

      - name: Check the outputs are reproducible from the seed
        run: |
          git diff --exit-code --stat -- data reports dashboard.html \
            || (echo "::error::Regenerating changed a committed output - the pipeline is not deterministic" && exit 1)

      - name: Publish the read-out and dashboard as a build artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: survey-read-out
          path: |
            reports/
            dashboard.html

  workbook:
    # The Excel twin: rebuilt from the data, compared with the committed file, recalculated by LibreOffice,
    # and every figure on its Reconciliation sheet checked against the Python pipeline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice and the workbook's tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
          pip install -r tools/requirements.txt

      - name: Rebuild the workbook; its content must be the committed one
        run: |
          python tools/build_workbook.py
          excel-twin same-as-git deliverables/engagement_survey.xlsx

      - name: Recalculate it and reconcile every figure
        run: |
          excel-twin recalc deliverables/engagement_survey.xlsx build/
          excel-twin check build/engagement_survey.xlsx

      - uses: actions/upload-artifact@v4
        with:
          name: workbook-recalculated
          path: build/engagement_survey.xlsx
